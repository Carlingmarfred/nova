[package]
name = "nova"
version = "0.16.0-native"
edition = "2021"
description = "Nova native pipeline (N-series): lexer, parser, bytecode VM"
license = "Apache-2.0"

[dependencies]
num-bigint = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"
regex = "1"

[lib]
name = "nova"
path = "src/lib.rs"

[[bin]]
name = "nova"
path = "src/main.rs"

